<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2433;--ink2:#4a5568;--glass:rgba(255,255,255,.38);--line:rgba(255,255,255,.7);--card:#26262b;--cardink:#fff;--accent:#5b6cff;--sky1:#9fc8ef;--sky2:#e8f1fa;--sky3:#6f9a78;--pop:rgba(255,255,255,.92)}
:root[data-skin="rosa"]{--accent:#e8579a;--sky1:#a9cbee;--sky2:#fbe6ee;--sky3:#7aa07e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef2fa;--ink2:#b6c0d2;--glass:rgba(20,26,40,.45);--line:rgba(255,255,255,.18);--pop:rgba(30,36,52,.95);--sky1:#2a4160;--sky2:#142034;--sky3:#233b2e}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%,var(--sky3));overflow:hidden}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#wall{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(6px) saturate(1.1);transform:scale(1.05)}
.stage{position:relative;height:100%;display:grid;grid-template-columns:64px 1fr;grid-template-rows:1fr 76px;gap:14px;padding:18px}
.g{background:var(--glass);border:1.5px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(20,40,80,.12)}
.side{grid-row:1;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px 0}
.ic{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--pop);font:700 13px Outfit;cursor:pointer;display:grid;place-items:center}
.ic.s{background:transparent;color:var(--ink)}
.main{grid-column:2;grid-row:1;border-radius:34px;position:relative;display:grid;grid-template-columns:230px 1fr 270px;padding:26px;overflow:hidden}
.left{display:flex;flex-direction:column;gap:22px;z-index:2}
.clock{font-size:46px;font-weight:600;letter-spacing:1px;line-height:1}
.date{font-size:15px;color:var(--ink2);margin-top:4px}
.cal{background:var(--card);color:var(--cardink);border-radius:22px;padding:16px 18px;width:200px}
.cal h3{text-align:center;font-size:17px;padding-bottom:8px;border-bottom:1px solid #555;margin-bottom:8px}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px 0;text-align:center;font-size:12px}
.cal .gr b{color:#9aa;font-weight:500}.cal .gr .t{background:var(--accent);border-radius:50%;font-weight:700}
.hero{position:relative;display:grid;place-items:center;min-height:0}
#char{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));cursor:pointer}
.ph{border:2px dashed var(--ink2);border-radius:28px;padding:40px 26px;text-align:center;color:var(--ink2);cursor:pointer;font-size:15px;max-width:240px}
.right{display:flex;flex-direction:column;gap:12px;z-index:2;min-height:0}
.top{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.pill{border:0;border-radius:99px;background:var(--pop);color:var(--ink);font:600 14px Outfit;padding:8px 16px;cursor:pointer}
.hi{font-size:19px;font-weight:600;text-align:right}
.cards{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;flex:1;min-height:0}
.cd{border-radius:18px;background:var(--pop) center/cover;border:0;cursor:pointer;color:var(--ink2);font:500 12px Outfit}
.cd:first-child{grid-row:span 2}
.music{background:var(--pop);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px}
.music button{border:0;background:var(--accent);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer}
.dock{grid-column:1/3;justify-self:center;border-radius:28px;display:flex;gap:16px;align-items:center;padding:0 26px}
.ap{width:46px;height:46px;border-radius:14px;border:0;font:700 15px Outfit;color:#fff;cursor:pointer;transition:transform .15s}
.ap:hover{transform:translateY(-4px)}
.ov{position:fixed;inset:0;background:rgba(10,16,30,.45);display:none;place-items:center;z-index:9;padding:20px}
.ov.on{display:grid}
.box{background:var(--pop);color:var(--ink);border-radius:24px;padding:24px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.box p{font-size:16px;line-height:1.45;margin-bottom:16px}
.box input{width:100%;font:500 16px Outfit;padding:10px 14px;border-radius:12px;border:1.5px solid var(--ink2);background:transparent;color:var(--ink);margin-bottom:16px}
.row{display:flex;gap:10px;justify-content:flex-end}
.row button{border:0;border-radius:99px;padding:10px 20px;font:600 14px Outfit;cursor:pointer;background:rgba(120,130,150,.2);color:var(--ink)}
.row .ok{background:var(--accent);color:#fff}
.menu button{display:block;width:100%;text-align:left;margin-bottom:6px;border:0;border-radius:12px;padding:12px 14px;font:500 15px Outfit;background:rgba(120,130,150,.15);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:820px){body{overflow:auto}.stage{height:auto;min-height:100%;grid-template-columns:1fr;grid-template-rows:auto auto auto}.side{flex-direction:row;padding:10px}.main{grid-column:1;grid-template-columns:1fr;gap:18px}.hero{min-height:300px}.cards{min-height:200px}.dock{grid-column:1;padding:12px 16px;flex-wrap:wrap;justify-content:center}}
@media (prefers-reduced-motion:reduce){.ap{transition:none}}
</style>
</head>
<body>
<div id="wall"></div>
<div class="stage">
  <nav class="side g" aria-label="Redes">
    <button class="ic s" data-go="https://www.google.com" aria-label="Buscar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="ic" data-go="https://www.tiktok.com">TT</button>
    <button class="ic" data-go="https://www.youtube.com">▶</button>
    <button class="ic" data-go="https://www.facebook.com">f</button>
    <button class="ic" data-go="https://www.instagram.com">IG</button>
    <button class="ic" data-go="https://x.com">X</button>
  </nav>
  <main class="main g">
    <section class="left">
      <div><div class="clock" id="clk">--:--</div><div class="date" id="dt"></div></div>
      <div class="cal" id="cal"></div>
    </section>
    <section class="hero" id="hero"></section>
    <section class="right">
      <div class="top"><button class="pill" id="skin" aria-label="Trocar cor">◐</button><button class="pill" id="nameBtn">Visitante</button><button class="pill" id="cfg" aria-label="Configurações">⚙</button></div>
      <div class="hi" id="hi"></div>
      <div class="cards"><button class="cd" data-slot="c1">+ foto</button><button class="cd" data-slot="c2">+ foto</button><button class="cd" data-slot="c3">+ foto</button></div>
      <div class="music"><button id="pl" aria-label="Tocar">▶</button><div><b>Sem título</b><br><span style="color:var(--ink2)">Nenhuma música</span></div></div>
    </section>
  </main>
  <nav class="dock g" id="dock" aria-label="Aplicativos"></nav>
</div>
<div class="ov" id="ov"><div class="box" id="box"></div></div>
<input type="file" accept="image/*" id="file" hidden>
<script>
const $=s=>document.querySelector(s),root=document.documentElement;
const S={name:"Visitante",skin:"azul",char:"",wall:"",c1:"",c2:"",c3:""};
try{Object.assign(S,JSON.parse(localStorage.getItem("launcher")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("launcher",JSON.stringify(S))}catch(e){}};
const apps=[["Windows","⊞","#2b7de9","ms-settings:"],["Spotify","S","#1db954","https://open.spotify.com"],["Photoshop","Ps","#001e36","https://www.photopea.com"],["Chrome","C","#e8453c","https://www.google.com"],["Illustrator","Ai","#330000","https://www.figma.com"],["Discord","D","#5865f2","https://discord.com/app"]];
function dlg(html,btns){$("#box").innerHTML=html;const r=document.createElement("div");r.className="row";btns.forEach(([t,f,ok])=>{const b=document.createElement("button");b.textContent=t;if(ok)b.className="ok";b.onclick=()=>{$("#ov").classList.remove("on");f&&f()};r.append(b)});$("#box").append(r);$("#ov").classList.add("on");const i=$("#box input");i&&i.focus()}
function confirmIt(msg,yes){dlg("<p>"+msg+"</p>",[["Cancelar"],["Confirmar",yes,1]])}
function pickImage(label,done){const f=$("#file");f.value="";f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>confirmIt("Usar esta imagem como "+label+"?",()=>done(rd.result));rd.readAsDataURL(file)};f.click()}
function render(){
 root.dataset.skin=S.skin;
 $("#nameBtn").textContent=S.name;$("#hi").textContent="Oi, "+S.name+"!";
 $("#wall").style.backgroundImage=S.wall?`url(${S.wall})`:"none";
 const h=$("#hero");h.innerHTML="";
 if(S.char){const i=new Image();i.id="char";i.src=S.char;i.alt="Personagem";i.onclick=()=>chooseChar();h.append(i)}
 else{const p=document.createElement("div");p.className="ph";p.textContent="Toque para escolher a imagem do personagem";p.onclick=chooseChar;h.append(p)}
 ["c1","c2","c3"].forEach(k=>{const b=document.querySelector(`[data-slot=${k}]`);b.style.backgroundImage=S[k]?`url(${S[k]})`:"";b.textContent=S[k]?"":"+ foto"});
}
function chooseChar(){pickImage("personagem",d=>{S.char=d;save();render()})}
function tick(){const d=new Date();$("#clk").textContent=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});$("#dt").textContent=d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"})}
function cal(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let h=`<h3>${d.toLocaleDateString("pt-BR",{month:"long"})}</h3><div class="gr">`+"DSTQQSS".split("").map(c=>`<b>${c}</b>`).join("");
 for(let i=0;i<first;i++)h+="<span></span>";for(let i=1;i<=n;i++)h+=`<span class="${i===d.getDate()?"t":""}">${i}</span>`;$("#cal").innerHTML=h+"</div>"}
apps.forEach(([n,l,c,u])=>{const b=document.createElement("button");b.className="ap";b.style.background=c;b.textContent=l;b.title=n;b.setAttribute("aria-label",n);b.onclick=()=>confirmIt("Abrir "+n+"?",()=>window.open(u,"_blank"));$("#dock").append(b)});
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>confirmIt("Abrir "+b.dataset.go.replace("https://","").replace("www.","")+"?",()=>window.open(b.dataset.go,"_blank")));
document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>pickImage("foto do card",d=>{S[b.dataset.slot]=d;save();render()}));
$("#nameBtn").onclick=()=>{dlg('<p>Qual nome mostrar?</p><input id="nm" maxlength="20" value="'+S.name.replace(/"/g,"")+'">',[["Cancelar"],["Continuar",()=>{const v=$("#nm").value.trim();if(v)confirmIt("Trocar o nome para “"+v+"”?",()=>{S.name=v;save();render()})},1]])};
$("#skin").onclick=()=>{const n=S.skin==="azul"?"rosa":"azul";confirmIt("Trocar a cor para "+n+"?",()=>{S.skin=n;save();render()})};
$("#pl").onclick=e=>{e.target.textContent=e.target.textContent==="▶"?"❚❚":"▶"};
$("#cfg").onclick=()=>{dlg('<div class="menu"><button id="m1">Trocar fundo</button><button id="m2">Trocar personagem</button><button id="m3">Remover fundo</button><button id="m4">Resetar tudo</button></div>',[["Fechar"]]);
 $("#m1").onclick=()=>{$("#ov").classList.remove("on");pickImage("fundo",d=>{S.wall=d;save();render()})};
 $("#m2").onclick=()=>{$("#ov").classList.remove("on");chooseChar()};
 $("#m3").onclick=()=>{$("#ov").classList.remove("on");confirmIt("Remover a imagem de fundo?",()=>{S.wall="";save();render()})};
 $("#m4").onclick=()=>{$("#ov").classList.remove("on");confirmIt("Apagar todas as suas escolhas e voltar ao padrão?",()=>{Object.assign(S,{name:"Visitante",skin:"azul",char:"",wall:"",c1:"",c2:"",c3:""});save();render()})}};
$("#ov").onclick=e=>{if(e.target.id==="ov")$("#ov").classList.remove("on")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#ov").classList.remove("on")});
render();cal();tick();setInterval(tick,10000);
</script>
</body>
</html>
